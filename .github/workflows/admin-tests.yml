name: Admin tests

on:
  pull_request:
    paths: ["admin/**"]
  push:
    branches: [main]
    paths: ["admin/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: admin/requirements.txt
      - run: pip install -r admin/requirements.txt
      - run: python -m unittest discover -s admin/tests -v
